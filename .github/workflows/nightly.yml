# Extended tier (otfabric/engineering standards/testing.md#ci-tiers): longer
# fuzzing, many chaos seeds, and the soak test, which normal CI skips.
#
# A failure names its seed: SUNSPEC_EXPLORER_CHAOS_SEED=<seed> replays it. A
# fuzz failure leaves its input in the artifact: commit it with the fix. The
# 24-hour soak of A14 does not fit a hosted runner (6 hours at most).
name: Nightly
run-name: "Nightly on ${{ github.ref_name }}"

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz-time:
        description: Time per fuzz target
        required: false
        default: 5m
      chaos-iterations:
        description: Chaos seeds
        required: false
        default: "500"
      soak-time:
        description: Soak duration (at most 5h on a hosted runner)
        required: false
        default: 30m

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      # Stable, as in go-ci: Go 1.26's fuzz coordinator has a race.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make fuzz FUZZTIME=${{ inputs.fuzz-time || '5m' }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-nightly
          path: "**/testdata/fuzz/"

  chaos:
    name: Chaos
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make chaos CHAOS_ITERATIONS=${{ inputs.chaos-iterations || '500' }}

  soak:
    name: Soak
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make soak SOAKTIME=${{ inputs.soak-time || '30m' }}
